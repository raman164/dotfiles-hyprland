decoration {
# See https://wiki.hyprland.org/Configuring/Variables/ for more
    rounding = 5
    blur {
        enabled = true
        size = 8
        passes = 4
        new_optimizations = true
        noise = 0.02
        contrast = 1.2
        brightness = 0.7
    }
    shadow {
        enabled = true
        range = 6
        render_power = 3
        color = rgba(1a1a1aee)
    }
}


# Just ignore this
# 720p
# monitor = HDMI-A-1, 1280x720@60, 0x0, 1

#windowrule = float,^(thunar)$
#windowrule = float,^(imv)$

#windowrule = size 1000 750, ^(thunar)$
#windowrule = size 1000 750, ^(imv)$

# Was: windowrulev2 = focusonactivate, class:.*
# windowrulev2 was removed in Hyprland 0.56; rules now use the match: syntax
# and the field is spelled focus_on_activate with an explicit value.
windowrule = match:class .*, focus_on_activate on
