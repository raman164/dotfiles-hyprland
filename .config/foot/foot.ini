include=/usr/share/foot/themes/tokyonight-night


[main]
term=foot
font-size-adjustment=2px
font=IosevkaTerm Nerd Font:pixelsize=16:antialias=true:hinting=true
shell=/bin/zsh
pad=4x4 center
initial-window-size-pixels=500x500
underline-offset=2

[colors-dark]
alpha=0.1
alpha-mode=all
blur=yes

[key-bindings]
clipboard-paste=Control+v
fullscreen=F11
